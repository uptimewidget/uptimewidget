[package]
name = "uptimewidget"
version = "0.1.0"
description = "Desktop & menu bar notifications for UptimeRobot"
authors = ["Peter Bagi"]
license = "MIT"
repository = "https://github.com/uptimewidget/uptimewidget"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "uptimewidget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Shown as the app name in the Dock / task manager during development.
[[bin]]
name = "UptimeWidget"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.5.0"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-single-instance = "2.5.5"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tokio = { version = "1.54.1", features = ["time", "sync", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4.34"
thiserror = "2.0.21"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "system-proxy"] }
sys-locale = "0.3.2"
tauri-plugin-updater = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
